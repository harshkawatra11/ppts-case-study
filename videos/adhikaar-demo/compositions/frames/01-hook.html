  <script>
    (function () {
      var DURATION = 8.32;
      var numEl = document.getElementById("fw-01-hook-num");
      var denomEl = document.getElementById("fw-01-hook-denom");
      var ruleEl = document.getElementById("fw-01-hook-rule");
      var sourceEl = document.getElementById("fw-01-hook-source");
      var bgFrame = document.querySelector(".fw-01-hook-bg-frame");
      var bgImg = document.querySelector(".fw-01-hook-bg-img");
      var column = document.querySelector(".fw-01-hook-column");

      var state = { value: 0 };
      var TARGET = 2797;
      var COUNT_DUR = 1.3; // Scene 1 (0.0-1.5s): count-up lands well inside the window
      var START_SCALE = 0.56; // START_SIZE / END_SIZE per counting-dynamic-scale

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- backdrop: dimmed, out-of-focus homepage ground, present from the open ----
      tl.fromTo(bgFrame, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
      // slow continuous camera lean-in across the whole shot
      tl.fromTo(bgImg, { scale: 1 }, { scale: 1.06, duration: DURATION, ease: "none" }, 0);

      // ---- Scene 1 (0.0-1.5s): "2,797" counts up, coral, oversized, dead-center ----
      tl.to(
        state,
        {
          value: TARGET,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: function () {
            numEl.textContent = Math.round(state.value).toLocaleString("en-IN");
          },
        },
        0
      );
      tl.fromTo(numEl, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, 0);

      // ---- Scene 2 (1.5-3.2s): "/ 3,128" settles in beside it, ink, smaller weight ----
      tl.fromTo(
        denomEl,
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
        1.5
      );

      // ---- Scene 3 (3.2-5.0s): source line fades up small beneath; frame settles ----
      tl.fromTo(ruleEl, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "power2.out" }, 3.2);
      tl.fromTo(
        sourceEl,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        3.35
      );

      // ---- hold (5.0-8.32s): still, subtle jitter at most — deterministic, no overshoot ----
      var holdStart = 5.0;
      var cycle = 1.2;
      var holdDur = DURATION - holdStart;
      tl.to(
        column,
        {
          scale: 1.006,
          duration: cycle / 2,
          ease: "sine.inOut",
          yoyo: true,
          repeat: Math.max(0, Math.floor(holdDur / cycle) - 1),
        },
        holdStart
      );

      // full-span anchor so this sub-composition's timeline spans the whole frame duration
      tl.to({}, { duration: DURATION }, 0);

      window.__timelines["01-hook"] = tl;
    })();
