<script>
(function () {
  var tl = gsap.timeline({ paused: true });

  // ---- Scene 1 (0.0–1.0s): bare navy-soft ground, near-invisible grid guide ----
  tl.fromTo('#stack-guide-v1, #stack-guide-v2, #stack-guide-h1',
    { opacity: 0 },
    { opacity: 0.08, duration: 0.7, ease: 'power1.out' },
    0.1
  );
  tl.fromTo('#stack-kicker',
    { opacity: 0, y: 12 },
    { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' },
    0.15
  );

  // ---- Scene 2 (1.0–5.0s): tiles cascade, one per spoken word, reading order ----
  var landings = [
    { id: '#stack-tile-0', t: 1.00, dur: 0.55, dy: 44, ease: 'power3.out' }, // Next.js 16
    { id: '#stack-tile-1', t: 1.85, dur: 0.55, dy: 40, ease: 'power3.out' }, // App Router
    { id: '#stack-tile-2', t: 2.70, dur: 0.55, dy: 40, ease: 'power3.out' }, // TypeScript
    { id: '#stack-tile-3', t: 3.55, dur: 0.55, dy: 40, ease: 'power3.out' }, // React 19
    { id: '#stack-tile-5', t: 4.40, dur: 0.55, dy: 40, ease: 'power3.out' }  // Firestore
  ];
  landings.forEach(function (item) {
    tl.fromTo(item.id,
      { opacity: 0, y: item.dy, scale: 0.86 },
      { opacity: 1, y: 0, scale: 1, duration: item.dur, ease: item.ease },
      item.t
    );
  });

  // ---- Scene 3 (5.0–6.0s): Vercel lands last, centered-bottom, coral, spring accent ----
  tl.fromTo('#stack-tile-4',
    { opacity: 0, y: 46, scale: 0.8 },
    { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: 'back.out(1.6)' },
    5.30
  );

  // ---- whole grid holds still: gentle sine float per tile (subtle life, no bounce) ----
  var tileIds = ['#stack-tile-0', '#stack-tile-1', '#stack-tile-2', '#stack-tile-3', '#stack-tile-5', '#stack-tile-4'];
  var floatStart = 5.95;
  var floatEnd = 6.869;
  tileIds.forEach(function (id, i) {
    if (floatEnd - floatStart <= 0) return;
    tl.to(id,
      { y: -4, duration: (floatEnd - floatStart) / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 },
      floatStart + i * 0.03
    );
  });

  // ---- slow camera push-in on the whole assembled grid during the hold ----
  tl.fromTo('#stack-gridwrap',
    { scale: 1 },
    { scale: 1.016, duration: 6.869 - 5.30, ease: 'power1.inOut' },
    5.30
  );
