# Publishes only the research PDF to GitHub Pages, at the same path it has in this repo.
# The full repo (~750 MB) is too large for a Pages deploy, so it is not published.
name: Publish research PDF

on:
  push:
    branches: [main]
    paths:
      - "swasthyagrid-gcp/nexora/research/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: swasthyagrid-gcp/nexora/research
      - name: Assemble site
        run: |
          mkdir -p _site/swasthyagrid-gcp/nexora/research
          cp swasthyagrid-gcp/nexora/research/swasthyagrid-nexora-research.pdf _site/swasthyagrid-gcp/nexora/research/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
