-logo1-img.svg","footerHeroLogoAlt":null,"faqs":{"faqsContent":[{"questionContent":[{"questionAndAnswer":"<div><p><b>Introducing the VIDA Electric Scooter in India</b><br>\r\n<br>\r\nGear up to experience speed, agility, and convenience like you've never imagined. With VIDA Electric Scooters, you ride through cities, rural routes, or really, anywhere across the country.</p>\r\n<hr>\r\n\r\n<p><b>We’re not the first, but we sure got it right.</b><br>\r\n<br>\r\nVIDA's single objective is to democratise clean mobility. Engineered &amp; Powered by HeroMotoCorp, these aren't the Electric Scooters you're used to, VIDA is built to take on Indian roads with ease and confidence.</p>\r\n<hr>\r\n\r\n<p><b>Not only that, we have put some serious thinking on the ownership plan for you:</b><br>\r\n<br>\r\n• 3 years/30000 km of Warranty on the Scooter<br>\r\n• 2 years of Extended Warranty on Batteries*<br>\r\n• 24/7 Road-Side Assistance<br>\r\n• VIDA Subscription Plans that gives you unique features around connectivity, security &amp; safety<br>\r\n• Exclusive <a href=\"https://www.vidaworld.com/offers.html\">Offers</a><br>\r\n• Pick-up and Drop Home Services<br>\r\n</p>\r\n<hr>\r\n\r\n<p><b>With VIDA, you're in for an unrivalled performance:</b><br>\r\n<br>\r\nIt comes with <a href=\"https://www.vidaworld.com/two-removable-batteries.html\">removable batteries</a>, that can be charged at home, office, or on the go<br>\r\n• Gives you a 142 km* range in one full single charge<br>\r\n• Running cost of only ₹0.17/km<br>\r\n• 80 km/h top speed<br>\r\n• 0-40 km/h acceleration in just 3.1 seconds<br>\r\n• Stay connected and in control with the touch-enabled 4.3-inch TFT vibrant screen. Its intuitive interface makes everything you do feel effortless.<br>\r\n• 18-degree incline capacity without power loss, so no road is too tough to climb<br>\r\n• Regenerative Braking to recharge your batteries when you hit the brakes<br>\r\n</p>\r\n<hr>\r\n\r\n<h1 class=\"footer-description__seo-header\"><b>Make way for VIDA Electric Scooters in India</b></h1>\r\n<p>As impressive as the specs are, we have gone one step further to truly define convenience. Adding some more:<br>\r\n• Use our parking assistance feature instead of dragging the scooter yourself<br>\r\n• Choose the one that fits your style from Variety of colours.<br>\r\n• Navigate effortlessly for a smoother ride.<br>\r\n• Activate safety with the SOS Alert button.<br>\r\n• Stay in control of your scooter via the MyVIDA App.<br>\r\n• Enjoy 27L of boot space with a separate storage of 6L for your portable charger.<br>\r\n• Power up at nearby <a href=\"https://www.vidaworld.com/charging-infrastructure.html\">EV charging stations</a>, at your convenience.<br>\r\n• Find <a href=\"https://www.vidaworld.com/dealers-locator.html\">Dealers</a> &amp; VIDA hubs in your neighbourhood.<br>\r\n</p>\r\n</div>\r\n","readMoreData":null,"isShowMore":false}],"title":"VIDA Electric Scooters In India"}]},"footerHeroLink":null,"footerLogoTitle":null,"footerLogoAlt":null,"isGlobal":false,"footerTermsAndSerivice":[{"navLink":"/terms-and-conditions.html","label":"Terms of Service","isButton":false},{"navLink":"/privacy-policy.html","label":"Privacy Policy","isButton":false},{"navLink":"/sitemap.html","label":"Sitemap","isButton":false}],"isShowFaqSection":true,"footerHeroLogo":null,"footerEmailLabel":"E-mail","footerMediaIcons":[{"image":"/content/dam/vida2-0/global/social-icon/new-footer-icon/facebook-icon.svg","imageAltText":"Facebook","link":"https://www.facebook.com/share/167Cn8pCfv/","newTab":true},{"image":"/content/dam/vida2-0/global/social-icon/new-footer-icon/linkedin-icon.svg","imageAltText":"LinkedIn","link":"https://www.linkedin.com/company/vidaworldofficial/","newTab":true},{"image":"/content/dam/vida2-0/global/social-icon/new-footer-icon/twitter-icon.svg","imageAltText":"twitter","link":"https://x.com/VidaDotWorld?s=20","newTab":true},{"image":"/content/dam/vida2-0/global/social-icon/new-footer-icon/youtube-icon.s
